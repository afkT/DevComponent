apply from: rootProject.file(files_component.build_library_gradle)

android {
    sourceSets {
        main {
            // 优化 res 资源管理, 使用 sourceSets 资源分包
            res.srcDirs = [
                    'src/main/res-tools', // 用于 xml tools:xxx 展示
            ]
        }
    }
}

dependencies {

    // 核心基础依赖库 ( 编译但不参与打包 )
    api project(':core_base_lib')

    // ===================
    // = core - 核心开发库 =
    // ===================

    // 通用 UI 样式、资源、交互、控件 lib
    api project(':core_lib_ui')

    // ====================
    // = libs - 第三方库依赖 =
    // ====================

    // ===============
    // = 图片相关组件库 =
    // ===============

    // Android 平台下的图片选择器 https://github.com/LuckSiege/PictureSelector
    api deps_lib.image_widget.pictureSelector
    api deps_lib.image_widget.pictureSelector_camerax
}